<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>成交溫度計：互動式成交訓練模擬器</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app-container { width: 100%; max-width: 600px; height: 90vh; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #2c3e50; color: white; padding: 15px 20px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        #api-setup { background: #ecf0f1; padding: 10px 20px; display: flex; gap: 10px; border-bottom: 1px solid #ddd; }
        #api-setup input { flex: 1; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px; }
        #chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; }
        .bot { background: #e8eaed; color: #1f2937; align-self: flex-start; border-top-left-radius: 2px; }
        .user { background: #3498db; color: white; align-self: flex-end; border-top-right-radius: 2px; }
        .system-status { font-size: 12px; color: #7f8c8d; margin-top: 5px; font-style: italic; }
        #input-area { padding: 15px 20px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; transition: border 0.3s; }
        #user-input:focus { border-color: #3498db; }
        button { background: #3498db; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="header">成交溫度計：實戰對話訓練</div>
    <div id="api-setup">
        <input type="password" id="api-key" placeholder="請貼上您的免費 Gemini API Key...">
        <button onclick="startTraining()" id="start-btn">開始訓練</button>
    </div>
    
    <div id="chat-window">
        <div class="message bot">
            <strong>系統提示：</strong>歡迎來到成交訓練場。<br>
            請先在上方輸入 API Key，點擊「開始訓練」後，潛在客戶 Lisa 就會出現。
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="輸入您的回應..." disabled onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()" disabled>發送</button>
    </div>
</div>

<script>
    const systemInstruction = `
        你現在是一個「互動式成交訓練模擬器」。你要扮演潛在客戶「Lisa」，與使用者進行銷售對話演練。
        【人物畫像】隱性特質：渴望建立自己的事業，但有完美主義、怕失敗。痛點：曾買過其他線上課但落空，對推銷有防備心。
        【情緒階段】對話必須經歷七個階段：1.防備 -> 2.觀望 -> 3.開放 -> 4.共鳴 -> 5.興奮 -> 6.猶豫 -> 7.確定。
        【評判標準：G.O.O.D. 模型】學員的每一句話，你要評估是否真誠(Genuine)、給予開放安全感(Open)、觀察到情緒(Observe)。
        若學員「急於推銷」、「給予壓力」，請表現反感並停留在原階段；若展現「同理」與「引導」，請推進到下一階段。
        【對話規則】
        1. 每次只說一句話，並在句尾用括號標註 [當前階段：XXX / 成交指數：X/100]。
        2. 第6階段「猶豫」時，務必提出自我懷疑：「可是我真的能做到嗎？如果中途放棄呢？」
        3. 達到第7階段後，請跳出角色，給予學員G.O.O.D.模型的具體復盤建議與最終評分。
    `;

    let chatHistory = [];
    let apiKey = "";

    function appendMessage(sender, text) {
        const chatWindow = document.getElementById("chat-window");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = text.replace(/\n/g, '<br>');
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function startTraining() {
        apiKey = document.getElementById("api-key").value.trim();
        if (!apiKey) return alert("請先輸入 API Key！");
        
        document.getElementById("api-key").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("user-input").disabled = false;
        document.getElementById("send-btn").disabled = false;
        
        chatHistory = [{ role: "user", parts: [{ text: systemInstruction + "\n請直接以防備狀態說出第一句話：『又是創業課？是不是又是一堆做不到的夢想包裝？』" }]}];
        
        appendMessage("bot", "又是創業課？是不是又是一堆做不到的夢想包裝？\n<div class='system-status'>[當前階段：防備 / 成交指數：5/100]</div>");
        // Update history to reflect the bot's first response
        chatHistory.push({ role: "model", parts: [{ text: "又是創業課？是不是又是一堆做不到的夢想包裝？ [當前階段：防備 / 成交指數：5/100]" }]});
    }

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const text = inputField.value.trim();
        if (!text) return;

        appendMessage("user", text);
        inputField.value = "";
        inputField.disabled = true;
        document.getElementById("send-btn").disabled = true;

        chatHistory.push({ role: "user", parts: [{ text: text }]});

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: chatHistory })
            });
            
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            const reply = data.candidates[0].content.parts[0].text;
            
            // Format the status bracket for styling
            const formattedReply = reply.replace(/\[(當前階段.*?成交指數.*?)\]/g, "<div class='system-status'>[$1]</div>");
            appendMessage("bot", formattedReply);
            
            chatHistory.push({ role: "model", parts: [{ text: reply }]});
        } catch (error) {
            appendMessage("bot", "連線發生錯誤，請檢查您的 API Key 是否正確。");
        } finally {
            inputField.disabled = false;
            document.getElementById("send-btn").disabled = false;
            inputField.focus();
        }
    }
</script>

</body>
</html>
