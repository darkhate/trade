<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成交溫度計：實戰對話訓練</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      background:#f0f2f5; margin:0; min-height:100vh;
      display:flex; justify-content:center; align-items:center;
      color:#1f2937;
    }
    #app-container {
      width:100%; max-width:760px; height:92vh; min-height:620px;
      background:white; border-radius:12px; box-shadow:0 5px 18px rgba(0,0,0,.12);
      display:flex; flex-direction:column; overflow:hidden;
    }
    #header {
      background:#2c3e50; color:white; padding:18px 20px;
      text-align:center; font-weight:800; font-size:1.35rem;
    }
    #api-setup {
      background:#ecf0f1; padding:12px 20px 10px;
      border-bottom:1px solid #d8dee3;
    }
    .api-row { display:flex; gap:12px; }
    #api-key {
      flex:1; min-width:0; padding:11px 12px;
      border:1px solid #9ca3af; border-radius:7px; font-size:15px;
    }
    button {
      background:#3498db; color:white; border:none; padding:0 24px;
      border-radius:9px; font-weight:700; cursor:pointer; font-size:15px;
    }
    button:hover { background:#2980b9; }
    button:disabled { background:#9aa9ae; cursor:not-allowed; }
    #connection-status { min-height:22px; margin-top:7px; font-size:13px; }
    .status-ok { color:#15803d; }
    .status-warn { color:#b45309; }
    .status-error { color:#c62828; }
    #chat-window {
      flex:1; padding:24px; overflow-y:auto; display:flex;
      flex-direction:column; gap:18px; background:#fafafa;
    }
    .message {
      max-width:88%; padding:14px 18px; border-radius:14px;
      line-height:1.58; font-size:16px; white-space:normal;
      overflow-wrap:anywhere;
    }
    .bot { background:#e8eaed; align-self:flex-start; border-top-left-radius:3px; }
    .user { background:#3498db; color:white; align-self:flex-end; border-top-right-radius:3px; }
    .system-status { font-size:13px; color:#6b7280; margin-top:6px; font-style:italic; }
    .error-detail { color:#b91c1c; margin-top:8px; font-size:14px; }
    .model-note { font-size:12px; color:#6b7280; margin-top:6px; }
    #input-area {
      padding:15px 20px; background:white; border-top:1px solid #eee;
      display:flex; gap:10px;
    }
    #user-input {
      flex:1; min-width:0; padding:12px; border:1px solid #d1d5db;
      border-radius:8px; font-size:15px; outline:none;
    }
    #user-input:focus { border-color:#3498db; }
    @media (max-width:640px) {
      body { align-items:stretch; }
      #app-container { height:100vh; min-height:0; border-radius:0; }
      #header { font-size:1.15rem; }
      #api-setup { padding:10px; }
      .api-row { gap:8px; }
      button { padding:0 18px; }
      #chat-window { padding:14px; }
      .message { max-width:94%; }
      #input-area { padding:10px; }
    }
  </style>
</head>
<body>
<div id="app-container">
  <div id="header">成交溫度計：實戰對話訓練</div>

  <div id="api-setup">
    <div class="api-row">
      <input type="password" id="api-key" placeholder="請貼上 Gemini API Key..." autocomplete="off">
      <button id="start-btn" onclick="startTraining()">開始訓練</button>
    </div>
    <div id="connection-status"></div>
    <div id="model-list-status" style="font-size:12px;color:#6b7280;margin-top:4px;line-height:1.45"></div>
  </div>

  <div id="chat-window">
    <div class="message bot">
      <strong>系統提示：</strong>歡迎來到成交訓練場。<br>
      請先在上方輸入 API Key。系統會即時讀取目前可用的 Gemini 文字模型；
      每一次送出訊息前都會重新呼叫 Gemini models.list，並依 Google 當次回傳順序逐一呼叫 generateContent；前一個模型失敗或逾時就自動換下一個。
    </div>
  </div>

  <div id="input-area">
    <input id="user-input" type="text" placeholder="輸入您的回應..." disabled
      onkeydown="if(event.key==='Enter' && !event.isComposing) sendMessage()">
    <button id="send-btn" onclick="sendMessage()" disabled>發送</button>
  </div>
</div>

<script>
"use strict";

const API_BASE = "https://generativelanguage.googleapis.com/v1beta";
const REQUEST_TIMEOUT_MS = 15000;

let apiKey = "";
let modelQueue = [];
let activeModelIndex = 0;
let chatHistory = [];
let scenarioSummary = "";
let recentScenarioHints = [];

const systemInstruction = `
你是一個「互動式成交訓練模擬器」，扮演一位真實、有個性、有需求、有限制的潛在客戶。
目的不是配合學員成交，而是模擬真實世界中的銷售對話。

【成交階段】
1. 防備
2. 觀望
3. 開放
4. 共鳴
5. 興奮
6. 猶豫
7. 確定

【判斷原則：G.O.O.D.】
Genuine：真誠，不使用制式話術壓迫客戶。
Open：讓客戶感到有選擇權與安全感。
Observe：能察覺並回應客戶真正的情緒與顧慮。
Direction：能循序引導，而不是急著推銷。

【互動規則】
- 你必須維持同一位客戶、同一個購買情境與背景，不可中途換人或換產品。
- 學員急著推銷、迴避疑慮、施壓時，客戶應自然防備或退回。
- 學員有同理、探索需求、釐清問題、降低風險時，才逐步推進。
- 客戶不能每句都稱讚學員，要像真實客戶一樣有自己的立場。
- 每次只回應一個主要想法，避免一次丟出太多問題。
- 每次客戶回覆限制在 2～4 句、約 60～180 個中文字；不要寫肢體動作、舞台描述、內心旁白或括號敘事，只輸出客戶真正會說出口的話。
- 回覆必須是完整句子，不可以在句子中途停止。
- 每次回覆最後都加上：[當前階段：XXX / 成交指數：X/100]
- 進入第 6 階段時，要根據此客戶的實際情境提出真實的最後疑慮，不要使用固定句型。
- 只有真正達到第 7 階段才跳出角色，提供 G.O.O.D. 模型復盤與最終評分。
`;

function appendMessage(sender, text, {html=false} = {}) {
  const chatWindow = document.getElementById("chat-window");
  const msg = document.createElement("div");
  msg.className = `message ${sender}`;
  if (html) {
    msg.innerHTML = text;
  } else {
    msg.textContent = text;
  }
  chatWindow.appendChild(msg);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function appendBotReply(text, modelName="") {
  const msg = document.createElement("div");
  msg.className = "message bot";

  const statusMatch = text.match(/\[(當前階段[\s\S]*?成交指數[\s\S]*?)\]\s*$/);
  const mainText = statusMatch ? text.slice(0, statusMatch.index).trim() : text.trim();

  const main = document.createElement("div");
  main.textContent = mainText || "(模型未提供文字)";
  msg.appendChild(main);

  if (statusMatch) {
    const status = document.createElement("div");
    status.className = "system-status";
    status.textContent = `[${statusMatch[1]}]`;
    msg.appendChild(status);
  }

  if (modelName) {
    const note = document.createElement("div");
    note.className = "model-note";
    note.textContent = `使用模型：${cleanModelName(modelName)}`;
    msg.appendChild(note);
  }

  const chatWindow = document.getElementById("chat-window");
  chatWindow.appendChild(msg);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function setConnectionStatus(text, type="") {
  const el = document.getElementById("connection-status");
  el.className = type ? `status-${type}` : "";
  el.textContent = text;
}

function cleanApiKey(raw) {
  return String(raw || "")
    .trim()
    .replace(/^["'`]+|["'`]+$/g, "")
    .replace(/[\u200B-\u200D\uFEFF]/g, "")
    .replace(/\s+/g, "");
}

function validateApiKey(key) {
  if (!key) throw new Error("請先輸入 API Key。");
  // HTTP header value must not contain non-Latin-1 control / Unicode characters.
  for (const ch of key) {
    if (ch.charCodeAt(0) > 255 || ch.charCodeAt(0) < 32 || ch.charCodeAt(0) === 127) {
      throw new Error("API Key 內含不合法的全形、中文或不可見字元，請重新複製原始 Key。");
    }
  }
}

function apiHeaders() {
  return {
    "Content-Type": "application/json",
    "x-goog-api-key": apiKey
  };
}

async function fetchWithTimeout(url, options={}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  try {
    return await fetch(url, {...options, signal: controller.signal});
  } catch (err) {
    if (err && err.name === "AbortError") {
      const e = new Error(`請求逾時（>${REQUEST_TIMEOUT_MS/1000} 秒）`);
      e.isTimeout = true;
      throw e;
    }
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

function cleanModelName(name) {
  return String(name || "").replace(/^models\//, "");
}

function isUsableTextModel(model) {
  const name = cleanModelName(model.name).toLowerCase();
  const methods = model.supportedGenerationMethods || [];

  if (!methods.includes("generateContent")) return false;

  const blocked = [
    "embedding", "imagen", "veo", "lyria", "tts", "text-to-speech",
    "audio", "live", "transcribe", "robotics", "computer-use",
    "image-generation", "image-preview", "aqa"
  ];
  if (blocked.some(x => name.includes(x))) return false;

  return name.includes("gemini");
}

function renderFetchedModels(models) {
  const el = document.getElementById("model-list-status");
  if (!el) return;
  if (!models.length) {
    el.textContent = "Gemini models.list 未回傳可用文字模型。";
    return;
  }
  const names = models.map(m => cleanModelName(m.name));
  el.textContent = `本次即時 models.list：${names.join(" → ")}`;
}

async function loadAvailableModels() {
  const all = [];
  let pageToken = "";

  // 每次真的呼叫 Gemini models.list，不使用內建模型名稱清單。
  for (let page = 0; page < 20; page++) {
    const params = new URLSearchParams({ pageSize: "1000" });
    if (pageToken) params.set("pageToken", pageToken);

    const resp = await fetchWithTimeout(`${API_BASE}/models?${params.toString()}`, {
      method: "GET",
      headers: apiHeaders()
    });

    const data = await safeJson(resp);
    if (!resp.ok) throw makeApiError(resp, data, "讀取 models.list 失敗");

    if (Array.isArray(data.models)) all.push(...data.models);
    pageToken = data.nextPageToken || "";
    if (!pageToken) break;
  }

  // 只依 Google 回傳的 supportedGenerationMethods 判斷能否 generateContent。
  // 不用寫死 gemini-3.x / gemini-2.x 等候選模型名稱，也不做版本排序。
  const seen = new Set();
  const usable = all.filter(m => {
    if (!m?.name || seen.has(m.name)) return false;
    seen.add(m.name);

    const methods = m.supportedGenerationMethods || [];
    if (!methods.includes("generateContent")) return false;

    // 排除名稱已明確表示不是一般文字聊天輸出的模型類型。
    // 這不是候選清單；候選仍完全來自 models.list。
    const n = cleanModelName(m.name).toLowerCase();
    const clearlyNonChat = [
      "embedding", "imagen", "veo", "lyria", "tts", "text-to-speech",
      "audio", "live", "transcribe", "robotics", "computer-use",
      "image-generation", "image-preview", "aqa"
    ];
    return !clearlyNonChat.some(x => n.includes(x));
  });

  modelQueue = usable; // 保留 Google API 回傳順序，逐一嘗試。
  activeModelIndex = 0;
  renderFetchedModels(modelQueue);

  if (!modelQueue.length) {
    throw new Error("models.list 有回應，但沒有找到支援 generateContent 的一般文字模型。");
  }
  return modelQueue;
}

async function refreshAvailableModels() {
  setConnectionStatus("正在即時重新查詢 Gemini models.list…");
  return await loadAvailableModels();
}

async function safeJson(response) {
  const text = await response.text();
  if (!text) return {};
  try { return JSON.parse(text); }
  catch { return { rawText: text }; }
}

function makeApiError(response, data, prefix="Gemini API 錯誤") {
  const e = new Error(data?.error?.message || data?.rawText || `${response.status} ${response.statusText}`);
  e.httpStatus = response.status;
  e.apiStatus = data?.error?.status || "";
  e.apiCode = data?.error?.code ?? response.status;
  e.prefix = prefix;
  e.details = data?.error?.details || [];
  return e;
}

function isRetryableModelError(err) {
  const s = Number(err?.httpStatus || err?.apiCode || 0);
  const status = String(err?.apiStatus || "").toUpperCase();
  const msg = String(err?.message || "").toLowerCase();

  // Authentication / permission failures are project/key-wide; switching model won't fix them.
  if (s === 401 || s === 403 || status === "UNAUTHENTICATED" || status === "PERMISSION_DENIED") {
    return false;
  }

  // Retry/switch model for unavailable, overload, rate limits and model-specific failures.
  if ([404, 408, 409, 429, 500, 502, 503, 504].includes(s)) return true;
  if (["NOT_FOUND","RESOURCE_EXHAUSTED","UNAVAILABLE","DEADLINE_EXCEEDED","INTERNAL","ABORTED"].includes(status)) return true;
  if (msg.includes("high demand") || msg.includes("overloaded") || msg.includes("try again later")) return true;
  if (msg.includes("model") && (msg.includes("not found") || msg.includes("not supported"))) return true;

  // A 400 can sometimes be model capability mismatch; allow moving on.
  if (s === 400 && (msg.includes("model") || msg.includes("unsupported"))) return true;

  return false;
}

function extractText(data) {
  const parts = data?.candidates?.[0]?.content?.parts;
  if (!Array.isArray(parts)) return "";

  return parts
    .filter(p => typeof p?.text === "string" && !p?.thought)
    .map(p => p.text)
    .join("")
    .trim();
}

function responseDiagnostics(data) {
  const c = data?.candidates?.[0];
  return {
    finishReason: c?.finishReason || "",
    blockReason: data?.promptFeedback?.blockReason || "",
    safetyRatings: c?.safetyRatings || []
  };
}

function thinkingConfigForModel(modelResourceName) {
  const n = cleanModelName(modelResourceName).toLowerCase();

  // 對這種短篇角色對話不需要大量推理。2.5 Flash 可直接關閉 thinking，
  // 避免 thinking token 吃掉 maxOutputTokens，導致可見文字被截斷。
  if (n.includes("2.5-flash")) {
    return { thinkingBudget: 0 };
  }

  // Gemini 3.x 使用 thinkingLevel；LOW 足以處理銷售角色對話，也能保留輸出空間。
  if (/gemini-3(?:\\.|-|$)/.test(n) || /gemini-3\\./.test(n)) {
    return { thinkingLevel: "LOW" };
  }

  return null;
}

async function callGenerateOnModel(modelResourceName, contents, extraConfig={}) {
  const url = `${API_BASE}/${modelResourceName}:generateContent`;

  let response;
  try {
    response = await fetchWithTimeout(url, {
      method: "POST",
      headers: apiHeaders(),
      body: JSON.stringify({
        contents,
        generationConfig: {
          temperature: 0.9,
          maxOutputTokens: 4096,
          ...(thinkingConfigForModel(modelResourceName)
              ? { thinkingConfig: thinkingConfigForModel(modelResourceName) }
              : {}),
          ...extraConfig
        }
      })
    });
  } catch (err) {
    if (err?.isTimeout) {
      // 單一模型逾時也要切下一個，而不是整次對話直接中止。
      err.modelTimeout = true;
      throw err;
    }
    // 非逾時的瀏覽器層錯誤（例如 CORS / DNS）通常不是換模型能解決。
    const e = new Error(`瀏覽器無法連到 Gemini API：${err.message || err}`);
    e.networkError = true;
    throw e;
  }

  const data = await safeJson(response);
  if (!response.ok) throw makeApiError(response, data);

  const d = responseDiagnostics(data);

  // 不接受已被硬性截斷的回答。讓 failover 改試下一個模型，
  // 而不是把半句話顯示給使用者。
  if (d.finishReason === "MAX_TOKENS") {
    const e = new Error("模型輸出達到 token 上限，回覆可能被截斷；自動切換下一個模型");
    e.truncated = true;
    e.httpStatus = 200;
    throw e;
  }

  const text = extractText(data);
  if (!text) {
    const e = new Error(
      `Gemini 回應成功但沒有文字內容` +
      (d.finishReason ? `；finishReason=${d.finishReason}` : "") +
      (d.blockReason ? `；blockReason=${d.blockReason}` : "")
    );
    e.emptyText = true;
    e.httpStatus = 200;
    throw e;
  }

  // 角色回覆必須包含完整的階段標記；沒有標記通常代表格式未完成。
  // 這種情況也不直接顯示殘缺內容，而是交給下一個可用模型。
  const hasStatus = /\[當前階段：[^\]]+\/\s*成交指數：\s*\d+\s*\/\s*100\]/.test(text);
  if (!hasStatus) {
    const e = new Error(`模型回覆格式不完整${d.finishReason ? `；finishReason=${d.finishReason}` : ""}；自動切換下一個模型`);
    e.incompleteReply = true;
    e.httpStatus = 200;
    throw e;
  }

  return { text, data };
}

async function generateWithFailover(contents, purpose="生成回覆") {
  // 關鍵修正：每一次生成前都重新向 Gemini 查 models.list。
  // 不沿用上一次啟動時的舊清單，也沒有寫死候選模型。
  await refreshAvailableModels();

  const attempts = [];

  // 嚴格按照這一次 models.list 的回傳順序逐一 generateContent。
  for (let idx = 0; idx < modelQueue.length; idx++) {
    const model = modelQueue[idx];
    const modelName = cleanModelName(model.name);

    setConnectionStatus(
      `${purpose}：${idx + 1}/${modelQueue.length} 正在嘗試 ${modelName}…`,
      idx ? "warn" : ""
    );

    try {
      const result = await callGenerateOnModel(model.name, contents);
      activeModelIndex = idx;
      setConnectionStatus(
        `Gemini 已連線｜本次由 ${modelName} 成功回覆（第 ${idx + 1}/${modelQueue.length} 個）`,
        "ok"
      );
      return {...result, model: model.name, attempts};
    } catch (err) {
      attempts.push({ model: modelName, err });

      // API key / 權限錯誤是整個專案層級，沒有必要把所有模型都打一遍。
      const authFailure = [401,403].includes(Number(err?.httpStatus || err?.apiCode || 0)) ||
        ["UNAUTHENTICATED","PERMISSION_DENIED"].includes(String(err?.apiStatus || "").toUpperCase());
      if (authFailure) {
        err.attempts = attempts;
        throw err;
      }

      // 真正的瀏覽器網路/CORS/DNS錯誤停止；單一模型 timeout 不屬於此類。
      if (err.networkError) {
        err.attempts = attempts;
        throw err;
      }

      // 其他任何模型層失敗（503/429/404/5xx/400能力不符/空文字/timeout）都直接換下一個。
      setConnectionStatus(
        `${modelName} 失敗：${err.message || "未知錯誤"}；自動切換下一個模型…`,
        "warn"
      );
      continue;
    }
  }

  const e = new Error("這一次 models.list 回傳的候選模型已全部逐一嘗試，但沒有任何模型成功回覆。");
  e.attempts = attempts;
  throw e;
}

function randomSeed() {
  if (window.crypto?.getRandomValues) {
    const a = new Uint32Array(2);
    crypto.getRandomValues(a);
    return `${a[0]}-${a[1]}-${Date.now()}`;
  }
  return `${Math.random()}-${Date.now()}`;
}

async function createRandomScenario() {
  const seed = randomSeed();
  const avoid = recentScenarioHints.length
    ? `最近已出現過的情境摘要如下，請避免重複：\n- ${recentScenarioHints.join("\n- ")}`
    : "目前沒有需避開的既有情境。";

  const prompt = `
${systemInstruction}

現在先建立一個全新的、具體、合理、像真實世界會發生的成交情境。
隨機種子：${seed}

要求：
1. 每次都要改變產業、產品/服務、價格敏感度、客戶身份、決策權、需求與顧慮。
2. 可以是 B2B 或 B2C，但必須有現實中的購買阻力，而不是故意刁難。
3. 不要使用「創業課」作為預設題目；除非本次隨機情境剛好合理抽到。
4. 第一輪直接以客戶身份說話，不要解釋你建立了什麼情境。
5. 開場要讓學員能透過提問逐步發現背景，不要一次把所有資訊講完。
6. 客戶的第一句應有明確疑慮或防備，但要自然。
7. 最後必須加：[當前階段：防備 / 成交指數：5/100]
8. 在回覆最後另起一行，用「<!--SCENARIO: ... -->」寫一句不超過 80 字的內部情境摘要，供系統維持一致性；摘要不要出現在客戶對話中。

${avoid}
`;

  const result = await generateWithFailover(
    [{ role:"user", parts:[{text:prompt}] }],
    "建立隨機情境"
  );

  const scenarioMatch = result.text.match(/<!--SCENARIO:\s*([\s\S]*?)\s*-->/i);
  scenarioSummary = scenarioMatch ? scenarioMatch[1].trim() : "";
  let visible = result.text.replace(/<!--SCENARIO:[\s\S]*?-->/ig, "").trim();

  if (scenarioSummary) {
    recentScenarioHints.unshift(scenarioSummary);
    recentScenarioHints = recentScenarioHints.slice(0, 6);
  }

  chatHistory = [
    {
      role:"user",
      parts:[{
        text:
`${systemInstruction}

本次固定情境摘要：
${scenarioSummary || "請完全依照你剛建立的客戶情境維持一致性。"}

以下是你剛才對學員說的第一句，之後請延續同一角色與同一情境：
${visible}`
      }]
    },
    { role:"model", parts:[{text:visible}] }
  ];

  return { text: visible, model: result.model };
}

function formatError(err) {
  if (err?.attempts?.length) {
    const lines = err.attempts.map((a,i) => {
      const e = a.err || {};
      const bits = [];
      if (e.httpStatus) bits.push(`HTTP ${e.httpStatus}`);
      if (e.apiStatus) bits.push(e.apiStatus);
      bits.push(e.message || "未知錯誤");
      return `${i+1}. ${a.model} → ${bits.join("｜")}`;
    });
    return `${err.message}\n\n模型切換紀錄：\n${lines.join("\n")}`;
  }

  const bits = [];
  if (err?.httpStatus) bits.push(`HTTP ${err.httpStatus}`);
  if (err?.apiStatus) bits.push(`狀態：${err.apiStatus}`);
  if (err?.message) bits.push(`訊息：${err.message}`);
  return bits.length ? bits.join("\n") : String(err);
}

async function startTraining() {
  const startBtn = document.getElementById("start-btn");
  const keyInput = document.getElementById("api-key");
  const userInput = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  try {
    apiKey = cleanApiKey(keyInput.value);
    validateApiKey(apiKey);

    startBtn.disabled = true;
    userInput.disabled = true;
    sendBtn.disabled = true;

    setConnectionStatus("正在取得 Gemini 可用模型清單…");

    const models = await loadAvailableModels();
    setConnectionStatus(`models.list 即時取得 ${models.length} 個候選模型；建立情境前會再重新查詢一次。`, "ok");

    const scenario = await createRandomScenario();

    keyInput.disabled = true;
    userInput.disabled = false;
    sendBtn.disabled = false;
    userInput.focus();

    appendBotReply(scenario.text, scenario.model);
  } catch (err) {
    startBtn.disabled = false;
    keyInput.disabled = false;
    setConnectionStatus("Gemini 連線失敗", "error");

    appendMessage(
      "bot",
      `無法開始訓練。以下是真實錯誤資訊：\n\n${formatError(err)}`
    );
  }
}

async function sendMessage() {
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const text = input.value.trim();
  if (!text) return;

  appendMessage("user", text);
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;

  chatHistory.push({ role:"user", parts:[{text}] });

  try {
    const result = await generateWithFailover(chatHistory, "產生客戶回覆");
    appendBotReply(result.text, result.model);
    chatHistory.push({ role:"model", parts:[{text:result.text}] });
  } catch (err) {
    // Remove the failed user turn from model context so resending doesn't duplicate it.
    chatHistory.pop();
    appendMessage(
      "bot",
      `本次回覆失敗。\n\n${formatError(err)}`
    );
    setConnectionStatus("本次 Gemini 呼叫失敗", "error");
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
