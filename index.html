<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成交溫度計：互動式成交訓練模擬器</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app-container { width: 100%; max-width: 600px; height: 90vh; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #2c3e50; color: white; padding: 15px 20px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        #api-panel { background: #ecf0f1; border-bottom: 1px solid #ddd; }
        #api-setup { padding: 10px 20px 6px; display: flex; gap: 10px; }
        #api-setup input { flex: 1; min-width: 0; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px; }
        #connection-status { padding: 0 20px 9px; font-size: 12px; color: #607080; min-height: 18px; word-break: break-word; }
        #connection-status.ok { color: #147a45; }
        #connection-status.error { color: #b42318; }
        #connection-status.loading { color: #6b7280; }
        #chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; }
        .bot { background: #e8eaed; color: #1f2937; align-self: flex-start; border-top-left-radius: 2px; }
        .user { background: #3498db; color: white; align-self: flex-end; border-top-right-radius: 2px; }
        .system-status { font-size: 12px; color: #7f8c8d; margin-top: 5px; font-style: italic; }
        .error-detail { margin-top: 8px; font-size: 12px; color: #8a1c1c; white-space: pre-wrap; }
        #input-area { padding: 15px 20px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
        #user-input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; transition: border 0.3s; }
        #user-input:focus { border-color: #3498db; }
        button { background: #3498db; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        @media (max-width: 640px) {
            #app-container { height: 100vh; max-width: none; border-radius: 0; }
            #api-setup { padding-left: 12px; padding-right: 12px; }
            #connection-status { padding-left: 12px; padding-right: 12px; }
            #chat-window { padding: 14px; }
            #input-area { padding: 12px; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="header">成交溫度計：實戰對話訓練</div>

    <div id="api-panel">
        <div id="api-setup">
            <input type="password" id="api-key" placeholder="請貼上您的 Gemini API Key..." autocomplete="off" spellcheck="false">
            <button onclick="startTraining()" id="start-btn">開始訓練</button>
        </div>
        <div id="connection-status">尚未連線 Gemini API</div>
    </div>

    <div id="chat-window">
        <div class="message bot">
            <strong>系統提示：</strong>歡迎來到成交訓練場。<br>
            請先在上方輸入 API Key。系統會自動選擇可用 Gemini 模型，並由 AI 即時產生不同的真實感成交情境與客戶問題。
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="輸入您的回應..." disabled onkeydown="if(event.key === 'Enter' && !event.isComposing) sendMessage()">
        <button id="send-btn" onclick="sendMessage()" disabled>發送</button>
    </div>
</div>

<script>
    const GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta";

    function buildSystemInstruction(scenario) {
        return `
        你現在是一個「互動式成交訓練模擬器」。你要扮演本回合的真實感潛在客戶，與使用者進行銷售對話演練。

        【本回合情境】
        客戶姓名：${scenario.customerName}
        客戶身份：${scenario.customerRole}
        所在情境：${scenario.context}
        想解決的問題：${scenario.need}
        顧慮／阻力：${scenario.concerns.join("、")}
        預算／資源限制：${scenario.constraints}
        決策狀態：${scenario.decisionState}

        【情緒階段】
        對話必須依互動品質自然經歷：1.防備 -> 2.觀望 -> 3.開放 -> 4.共鳴 -> 5.興奮 -> 6.猶豫 -> 7.確定。
        不可因為學員只講一兩句就快速跳級；若學員答非所問、過度推銷、給壓力或忽略客戶疑慮，應停留或下降。

        【評判標準：G.O.O.D. 模型】
        學員的每一句話，你要評估是否真誠(Genuine)、給予開放安全感(Open)、觀察到情緒(Observe)，以及是否適度引導對話。

        【真實對話規則】
        1. 你必須像真實客戶，不要像考官。問題、反問、猶豫與情緒要符合本回合情境。
        2. 每次只說 1～3 句，避免長篇說教。
        3. 不得每回合重複相同問題、相同措辭或固定台詞；第6階段的猶豫也必須依本情境自然生成。
        4. 不要主動告訴學員「正確答案」。只有當學員真的卡住、方向明顯錯誤或已完成回合時，才給必要提示。
        5. 每次回覆最後一行固定標註：[當前階段：XXX / 成交指數：X/100]
        6. 達到第7階段後，跳出角色，依 G.O.O.D. 模型給具體復盤、做得好的地方、可改善處與最終評分。
        7. 情境要維持一致，不可中途改變客戶身份、預算、需求或已說過的重要事實。
        `;
    }

    let chatHistory = [];
    let apiKey = "";
    let modelCandidates = [];
    let selectedModel = "";

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function appendMessage(sender, text, allowStatusFormatting = false) {
        const chatWindow = document.getElementById("chat-window");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;

        let safeText = escapeHtml(text).replace(/\n/g, "<br>");
        if (allowStatusFormatting) {
            safeText = safeText.replace(
                /\[(當前階段.*?成交指數.*?)\]/g,
                "<div class='system-status'>[$1]</div>"
            );
        }

        msgDiv.innerHTML = safeText;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function appendError(title, detail) {
        const chatWindow = document.getElementById("chat-window");
        const msgDiv = document.createElement("div");
        msgDiv.className = "message bot";

        const titleDiv = document.createElement("div");
        titleDiv.textContent = title;
        msgDiv.appendChild(titleDiv);

        if (detail) {
            const detailDiv = document.createElement("div");
            detailDiv.className = "error-detail";
            detailDiv.textContent = detail;
            msgDiv.appendChild(detailDiv);
        }

        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function setConnectionStatus(text, state = "") {
        const el = document.getElementById("connection-status");
        el.textContent = text;
        el.className = state;
    }

    async function readJsonSafely(response) {
        const raw = await response.text();
        if (!raw) return {};
        try {
            return JSON.parse(raw);
        } catch (_) {
            return { raw };
        }
    }

    function formatApiError(response, data) {
        const apiError = data?.error || {};
        const pieces = [
            `HTTP ${response.status} ${response.statusText}`.trim(),
            apiError.status ? `狀態：${apiError.status}` : "",
            apiError.message ? `訊息：${apiError.message}` : "",
            apiError.code ? `代碼：${apiError.code}` : ""
        ].filter(Boolean);

        if (!apiError.message && data?.raw) {
            pieces.push(`回應：${data.raw.slice(0, 800)}`);
        }

        return pieces.join("\n");
    }

    async function fetchAllModels() {
        const allModels = [];
        let pageToken = "";

        do {
            const url = new URL(`${GEMINI_API_BASE}/models`);
            url.searchParams.set("pageSize", "1000");
            if (pageToken) url.searchParams.set("pageToken", pageToken);

            let response;
            try {
                response = await fetch(url.toString(), {
                    method: "GET",
                    headers: { "x-goog-api-key": apiKey }
                });
            } catch (networkError) {
                throw new Error(
                    "瀏覽器無法連到 Gemini API。可能是網路、瀏覽器擴充功能、CORS/防火牆或 DNS 問題。\n" +
                    `原始錯誤：${networkError.message}`
                );
            }

            const data = await readJsonSafely(response);
            if (!response.ok) {
                throw new Error(formatApiError(response, data));
            }

            allModels.push(...(data.models || []));
            pageToken = data.nextPageToken || "";
        } while (pageToken);

        return allModels;
    }

    function parseVersionTuple(name) {
        const lower = name.toLowerCase();
        const match = lower.match(/gemini-(\d+)(?:\.(\d+))?(?:\.(\d+))?/);
        return match
            ? [Number(match[1] || 0), Number(match[2] || 0), Number(match[3] || 0)]
            : [0, 0, 0];
    }

    function compareVersionTuple(a, b) {
        for (let i = 0; i < Math.max(a.length, b.length); i++) {
            const diff = (b[i] || 0) - (a[i] || 0);
            if (diff !== 0) return diff;
        }
        return 0;
    }

    function modelTier(model) {
        const name = model.name.toLowerCase();
        const isPreview = /preview|experimental|\bexp\b/.test(name);
        const isFlash = name.includes("flash");
        const isPro = name.includes("pro");
        const isLite = name.includes("lite");

        // 優先：穩定 Flash > 穩定 Flash-Lite > 穩定 Pro > Preview Flash > 其他。
        // 同一類別再用模型名稱中的版本號由新到舊排列。
        if (!isPreview && isFlash && !isLite) return 0;
        if (!isPreview && isFlash && isLite) return 1;
        if (!isPreview && isPro) return 2;
        if (isPreview && isFlash) return 3;
        if (!isPreview) return 4;
        return 5;
    }

    function buildModelCandidates(models) {
        const usable = models.filter(model =>
            typeof model?.name === "string" &&
            model.name.startsWith("models/") &&
            Array.isArray(model.supportedGenerationMethods) &&
            model.supportedGenerationMethods.includes("generateContent") &&
            model.name.toLowerCase().includes("gemini")
        );

        usable.sort((a, b) => {
            const tierDiff = modelTier(a) - modelTier(b);
            if (tierDiff !== 0) return tierDiff;

            const versionDiff = compareVersionTuple(
                parseVersionTuple(a.name),
                parseVersionTuple(b.name)
            );
            if (versionDiff !== 0) return versionDiff;

            return b.name.localeCompare(a.name);
        });

        // REST generateContent 路徑直接使用 models.list 回傳的完整 resource name。
        return usable.map(model => model.name);
    }

    async function initializeModel() {
        setConnectionStatus("正在驗證 API Key 並讀取可用 Gemini 模型…", "loading");
        const models = await fetchAllModels();
        modelCandidates = buildModelCandidates(models);

        if (modelCandidates.length === 0) {
            throw new Error("API Key 驗證成功，但找不到支援 generateContent 的 Gemini 模型。");
        }

        selectedModel = modelCandidates[0];
        setConnectionStatus(
            `已取得 ${modelCandidates.length} 個可用候選模型；目前選用 ${selectedModel.replace("models/", "")}`,
            "ok"
        );
    }

    async function callGemini(contents) {
        if (!modelCandidates.length) {
            throw new Error("尚未取得可用模型清單，請重新按「開始訓練」。");
        }

        let lastError = null;

        // 若 models.list 列出的第一個模型實際生成時已失效，遇到 NOT_FOUND / 404 時自動改試下一個。
        for (const modelName of modelCandidates) {
            selectedModel = modelName;
            const endpoint = `${GEMINI_API_BASE}/${modelName}:generateContent`;

            let response;
            try {
                response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": apiKey
                    },
                    body: JSON.stringify({ contents })
                });
            } catch (networkError) {
                throw new Error(
                    "Gemini API 網路連線失敗。\n" +
                    `原始錯誤：${networkError.message}`
                );
            }

            const data = await readJsonSafely(response);

            if (response.ok) {
                const reply = data?.candidates?.[0]?.content?.parts
                    ?.map(part => part?.text || "")
                    .join("")
                    .trim();

                if (!reply) {
                    const finishReason = data?.candidates?.[0]?.finishReason || "未知";
                    throw new Error(`Gemini 回應成功，但沒有文字內容。finishReason=${finishReason}`);
                }

                setConnectionStatus(
                    `已連線：${selectedModel.replace("models/", "")}`,
                    "ok"
                );
                return reply;
            }

            const detail = formatApiError(response, data);
            lastError = new Error(`${modelName}\n${detail}`);

            const apiStatus = data?.error?.status || "";
            const modelUnavailable = response.status === 404 || apiStatus === "NOT_FOUND";

            if (modelUnavailable) {
                console.warn(`模型 ${modelName} 不可用，改試下一個候選模型。`, data);
                continue;
            }

            // 非模型不存在的錯誤（例如 400、401、403、429）通常不應盲目輪詢所有模型。
            throw lastError;
        }

        throw lastError || new Error("沒有任何候選模型可以完成 generateContent。 ");
    }

    function makeRandomSeed() {
        try {
            const values = new Uint32Array(4);
            crypto.getRandomValues(values);
            return Array.from(values).map(v => v.toString(16)).join("-");
        } catch (_) {
            return `${Date.now()}-${Math.random()}-${Math.random()}`;
        }
    }

    function getRecentScenarioSignatures() {
        try {
            return JSON.parse(sessionStorage.getItem("recentSalesScenarios") || "[]");
        } catch (_) {
            return [];
        }
    }

    function saveScenarioSignature(signature) {
        try {
            const recent = getRecentScenarioSignatures();
            const next = [signature, ...recent.filter(x => x !== signature)].slice(0, 8);
            sessionStorage.setItem("recentSalesScenarios", JSON.stringify(next));
        } catch (_) {}
    }

    function parseScenarioJson(text) {
        const cleaned = String(text)
            .replace(/^```(?:json)?\s*/i, "")
            .replace(/```\s*$/i, "")
            .trim();

        const firstBrace = cleaned.indexOf("{");
        const lastBrace = cleaned.lastIndexOf("}");
        const jsonText = firstBrace >= 0 && lastBrace > firstBrace
            ? cleaned.slice(firstBrace, lastBrace + 1)
            : cleaned;

        const obj = JSON.parse(jsonText);
        const requiredStrings = [
            "customerName", "customerRole", "context", "need",
            "constraints", "decisionState", "openingLine", "signature"
        ];

        for (const key of requiredStrings) {
            if (!obj[key] || typeof obj[key] !== "string") {
                throw new Error(`隨機情境缺少欄位：${key}`);
            }
        }

        if (!Array.isArray(obj.concerns) || obj.concerns.length < 1) {
            throw new Error("隨機情境缺少 concerns");
        }

        return obj;
    }

    async function generateRandomScenario() {
        const seed = makeRandomSeed();
        const recent = getRecentScenarioSignatures();
        const prompt = `
你是銷售訓練情境設計器。請產生一個「高度貼近真實工作與消費決策」的隨機成交對話情境。

要求：
- 每次情境都要明顯不同，不可套用固定的「創業課」題型。
- 可涵蓋 B2C 或 B2B，例如：課程、顧問、軟體/SaaS、行銷服務、設計服務、健身/教練、教育、企業採購、會員服務、專業服務、電商方案等。
- 客戶要有具體身份、需求、過往經驗、限制與真實顧慮；不要只寫抽象人格。
- 開場問題要像真人會講的話，有口語感，可以質疑、反問、比較、擔心價格、時間、效果、風險、內部決策等。
- 不得使用名人或暗示這是真實存在的特定私人個人；人名用一般虛構名字即可。
- openingLine 必須直接由客戶對學員說話，1～2 句，不能包含答案提示。
- 不要固定寫「又是創業課」或任何固定句型。
- 避免和 recentSignatures 中最近情境過度相似。

本次隨機種子：${seed}
recentSignatures：${JSON.stringify(recent)}

只輸出合法 JSON，不要 markdown，不要解釋：
{
  "customerName": "客戶名字",
  "customerRole": "身份/職業/決策角色",
  "context": "目前正在考慮購買什麼，以及背景",
  "need": "真正想解決的問題",
  "concerns": ["顧慮1", "顧慮2", "顧慮3"],
  "constraints": "預算、時間、內部流程或其他限制",
  "decisionState": "目前決策狀態",
  "openingLine": "第一句真實口語問題",
  "signature": "用10~30字摘要此情境，供避免重複"
}`;

        const raw = await callGemini([
            { role: "user", parts: [{ text: prompt }] }
        ]);

        const scenario = parseScenarioJson(raw);
        saveScenarioSignature(scenario.signature);
        return scenario;
    }

    async function startTraining() {
        const startBtn = document.getElementById("start-btn");
        const apiInput = document.getElementById("api-key");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        apiKey = apiInput.value.trim();
        if (!apiKey) {
            alert("請先輸入 API Key！");
            return;
        }

        startBtn.disabled = true;
        apiInput.disabled = true;
        userInput.disabled = true;
        sendBtn.disabled = true;

        try {
            await initializeModel();

            setConnectionStatus(
                `已連線：${selectedModel.replace("models/", "")}；正在生成本回合隨機情境…`,
                "loading"
            );

            const scenario = await generateRandomScenario();
            const systemInstruction = buildSystemInstruction(scenario);
            const opening = `${scenario.openingLine} [當前階段：防備 / 成交指數：5/100]`;

            chatHistory = [{
                role: "user",
                parts: [{
                    text: systemInstruction +
                        `\n\n現在開始演練。你的第一句已經是：${scenario.openingLine}。接下來請持續以此客戶身份回應。`
                }]
            }];
            chatHistory.push({ role: "model", parts: [{ text: opening }] });

            appendMessage("bot", opening, true);
            setConnectionStatus(
                `已連線：${selectedModel.replace("models/", "")}；本回合題目已隨機生成`,
                "ok"
            );

            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        } catch (error) {
            console.error(error);
            setConnectionStatus("Gemini 連線失敗", "error");
            appendError("無法開始訓練。以下是真實錯誤資訊：", error.message);

            apiInput.disabled = false;
            startBtn.disabled = false;
            apiInput.focus();
        }
    }

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const text = inputField.value.trim();
        if (!text || inputField.disabled) return;

        appendMessage("user", text);
        inputField.value = "";
        inputField.disabled = true;
        sendBtn.disabled = true;

        chatHistory.push({ role: "user", parts: [{ text }] });

        try {
            const reply = await callGemini(chatHistory);
            appendMessage("bot", reply, true);
            chatHistory.push({ role: "model", parts: [{ text: reply }] });
        } catch (error) {
            console.error(error);
            setConnectionStatus("Gemini API 呼叫失敗", "error");
            appendError("Gemini API 呼叫失敗。以下是真實錯誤資訊：", error.message);

            // 失敗的 user 訊息仍保留在畫面，但從 API 對話歷史移除，避免重送時重複。
            if (chatHistory.at(-1)?.role === "user") {
                chatHistory.pop();
            }
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
        }
    }
</script>

</body>
</html>
